<template data-console-for="zoojack">
  <li class="log">
    <button class="log-head" type="button" aria-expanded="false">
      <span class="log-icon" aria-hidden="true">⚠</span>
      <span class="log-msg">게임 진행 로직과 화면 표시(UI) 코드가 GameDirector 한 클래스에 몰림</span>
      <span class="log-src">GameDirector 리팩터링</span>
    </button>
    <div class="log-body" hidden>
      <dl class="rows">
        <div class="row"><dt>문제</dt><dd>게임 진행 로직과 화면 표시(UI) 코드가 GameDirector 한 클래스에 몰려, 인스펙터에서 값을 찾고 수정하기가 점점 어려워짐.</dd></div>
        <div class="row"><dt>원인</dt><dd>게임 규칙 처리와 칩·머니바·승패 표시 같은 UI 갱신이 한 클래스에 섞여 책임이 과도하게 집중됨. 하드코딩된 값도 관리가 힘들어짐.</dd></div>
        <div class="row"><dt>해결</dt><dd>화면 표시 코드를 역할별로 4개 클래스(Presenter 1개 · View 3개)로 분리하고, 하드코딩을 걷어냄.</dd></div>
        <div class="row"><dt>결과</dt><dd>기능별 위치가 명확해져 값 수정과 디버깅이 쉬워짐. '동작하는 코드'와 '유지보수되는 코드'의 차이를 체감.</dd></div>
      </dl>
      <div class="refactor">
        <p class="refactor-label">BEFORE</p>
        <p class="class-box"><b>GameDirector</b> 게임 진행 + 화면 표시가 한 클래스에</p>
        <p class="refactor-label">AFTER · 화면 표시 코드를 역할별로 분리</p>
        <p class="class-box"><b>GamePanelPresenter</b> 핫시트·네트워크 공통 화면 조작</p>
        <p class="class-box"><b>BetChipsView</b> 판돈 칩·금액 표시</p>
        <p class="class-box"><b>MoneyBarView</b> 플레이어별 머니바</p>
        <p class="class-box"><b>ResultMarkerView</b> 승패 표식 (왕관·비석)</p>
        <p class="refactor-foot">게임 진행은 GameDirector에 남기고, 화면 표시만 4개 클래스로 분리</p>
      </div>
    </div>
  </li>
</template>

<script src="js/records.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
